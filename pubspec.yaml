name: mirrorfly_plugin
description: A Mirrorfly Flutter plugin to Experience an outstanding real time messaging solution. The powerful communication that adds an extra mileage to build your chat app.
version: 0.0.9
homepage: https://www.mirrorfly.com/docs/chat/flutter/quick-start/

environment:
  sdk: '>=2.18.0 <3.0.0'
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mirrorfly.mirrorfly_plugin
        pluginClass: FlyChatPlugin
      ios:
        pluginClass: FlyChatPlugin
